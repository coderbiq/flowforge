<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THROWAWAY — Artifact hand-off validation</title>
<style>:root{color-scheme:dark;--b:#101419;--p:#192029;--l:#394553;--i:#e9eef4;--m:#9eabb9;--a:#7caeff;--g:#69d493;--w:#efbd62}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font:15px/1.5 system-ui}header{padding:18px 22px;border-bottom:1px solid var(--l)}h1{font-size:21px;margin:0}h2{font-size:16px;margin-top:0}.w{color:var(--w)}.m{color:var(--m)}.layout{display:grid;grid-template-columns:350px 1fr;min-height:calc(100vh - 78px)}aside,main{padding:18px;min-width:0}aside{border-right:1px solid var(--l)}.panel{background:var(--p);border:1px solid var(--l);border-radius:9px;padding:14px;margin-bottom:12px}button{background:#242d38;color:var(--i);border:1px solid var(--l);border-radius:6px;padding:8px 10px;margin:3px;cursor:pointer}button.active,button:hover{border-color:var(--a)}button.primary{background:#245087}button:disabled{opacity:.4}.step{border-left:3px solid var(--l);padding:7px 9px;margin:5px}.step.done{border-color:var(--g)}.step.current{border-color:var(--a);background:#1c2938}pre{background:#0b0e12;border:1px solid #29313b;border-radius:7px;padding:13px;white-space:pre-wrap;max-height:58vh;overflow:auto}a{color:#b0ceff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:850px){.layout,.grid{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid var(--l)}}</style></head>
<body><header><h1>Artifact hand-off 验证 <span class="w">— THROWAWAY v3</span></h1><div class="m">Requirement → Design → Ticket → Evidence；显示完整 authority、revision、diagnostics 和 effective specification。</div></header>
<div class="layout"><aside><div class="panel"><h2>场景</h2><button id="simple" onclick="choose('simple')">简单 compact ticket</button><button id="complex" onclick="choose('complex')">复杂 artifact chain</button></div>
<div class="panel"><h2>操作</h2><button class="primary" id="next" onclick="advance()">推进 hand-off</button><button onclick="semanticChange()">模拟 Design 语义变化</button><button onclick="acknowledge()">重新检查 revision</button><button onclick="reset()">重置</button></div>
<div class="panel"><h2>样例</h2><a href="scenario-fixtures/v3/simple-ticket.example.md">Simple ticket</a><br><a href="scenario-fixtures/v3/complex-requirements.example.md">Requirements</a><br><a href="scenario-fixtures/v3/complex-design.example.md">Design</a><br><a href="scenario-fixtures/v3/rpc-ticket.example.md">RPC ticket</a><br><a href="scenario-fixtures/v3/rpc-evidence.example.md">Evidence</a><br><a href="artifact-scenario-validation-v0.3.md">Verdict</a></div></aside>
<main><div class="grid"><section class="panel"><h2>Hand-offs</h2><div id="steps"></div></section><section class="panel"><h2>Effective specification</h2><div id="effective"></div></section></div><section class="panel"><h2>完整派生状态</h2><pre id="state"></pre></section></main></div>
<script>
const flows={simple:[
 {name:'Intake → compact ticket',run:s=>{s.authorities.ticket={id:'frontier-text-warning-count',revision:1,roles:['requirement','design-increment','execution','evidence-placeholder']};s.diagnostics=[]}},
 {name:'Ticket → implementation',run:s=>{s.frontier.ready=['frontier-text-warning-count'];s.effective=['project invariants','compact ticket revision 1'];}},
 {name:'Implementation → inline evidence',run:s=>{s.authorities.ticket.roles[3]='completion-evidence';s.completed=['frontier-text-warning-count'];}}
],complex:[
 {name:'Requirement → solution design',run:s=>{s.authorities.requirements={id:'tangram-backend-refinement-requirements',revision:2};s.authorities.design={areas:{rpc:{revision:3,status:'covered'},agent:{revision:1,status:'gap'},web:{revision:2,status:'covered'},trigger:{revision:2,status:'covered'}}};}},
 {name:'Design → scoped planning',run:s=>{s.frontier.ready=['rpc','web','trigger'];s.frontier.gaps=['agent: composition interface unresolved'];}},
 {name:'Plan → RPC ticket',run:s=>{s.authorities.ticket={id:'migrate-rpc-route-execution',revision:1,consumes:{requirements:2,rpcDesign:3}};s.effective=['project invariants','requirements revision 2','rpc design area revision 3','RPC ticket revision 1'];}},
 {name:'Implementation/review → evidence',run:s=>{s.authorities.evidence={id:'migrate-rpc-route-execution-evidence',revision:1,ticket:'migrate-rpc-route-execution'};s.completed=['rpc'];}}
]};
let mode='simple',model;
function fresh(){return{mode,step:0,authorities:{},frontier:{ready:[],gaps:[],warnings:[]},effective:[],diagnostics:[],completed:[]}}
function choose(x){mode=x;model=fresh();render()}function reset(){model=fresh();render()}
function advance(){let f=flows[mode];if(model.step>=f.length)return;f[model.step].run(model);model.step++;render()}
function semanticChange(){if(mode!=='complex'||!model.authorities.design){model.diagnostics=['no independent design authority in this scenario'];render();return}model.authorities.design.areas.rpc.revision=4;if(model.authorities.ticket&&model.authorities.ticket.consumes.rpcDesign<4){model.frontier.warnings=['upstream-changed: RPC design consumed 3, current 4'];model.diagnostics=['RPC remains ready with warning; unrelated web/trigger work is unchanged']}render()}
function acknowledge(){if(mode==='complex'&&model.authorities.ticket&&model.authorities.design){model.authorities.ticket.consumes.rpcDesign=model.authorities.design.areas.rpc.revision;model.frontier.warnings=[];model.diagnostics=['RPC ticket rechecked against current design area revision']}render()}
function render(){document.getElementById('simple').classList.toggle('active',mode==='simple');document.getElementById('complex').classList.toggle('active',mode==='complex');let f=flows[mode];document.getElementById('next').disabled=model.step>=f.length;document.getElementById('steps').innerHTML=f.map((x,i)=>`<div class="step ${i<model.step?'done':i===model.step?'current':''}">${x.name}</div>`).join('');document.getElementById('effective').innerHTML=model.effective.length?`<ol>${model.effective.map(x=>`<li>${x}</li>`).join('')}</ol><p class="m">这是解析视图，不是复制生成的新文档。</p>`:'<p class="m">推进到执行 ticket 后显示。</p>';document.getElementById('state').textContent=JSON.stringify(model,null,2)}
model=fresh();render();
</script></body></html>
